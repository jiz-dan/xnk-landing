<style>
  :root { --ink-900: #0A0A0A; --ink-500: #666666; --ink-100: #EFEFEF; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: linear-gradient(-45deg, #F7F7F7, #F0F0F0, #EDEDED, #F7F7F7);
    background-size: 400% 400%; animation: meshDrift 15s ease infinite;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @keyframes meshDrift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .card {
    width: 100%; max-width: 380px; margin: 20px; padding: 36px 30px;
    background: #fff; border-radius: 24px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08), 0 8px 16px -4px rgba(0,0,0,0.04);
    text-align: center;
  }
  .card h1 {
    margin: 0 0 8px; font-size: 15px; font-weight: 800; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-900);
  }
  .card p { margin: 0 0 22px; font-size: 12.5px; color: var(--ink-500); line-height: 1.5; }
  .links { display: flex; justify-content: center; gap: 20px; font-size: 13px; font-weight: 700; }
  .links a { color: var(--ink-900); text-decoration: none; border-bottom: 1px solid var(--ink-100); padding-bottom: 2px; }
  .links a:hover { border-color: var(--ink-900); }
</style>
